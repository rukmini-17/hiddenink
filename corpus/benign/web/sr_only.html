<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessible links</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 760px;
         margin: 40px auto; padding: 0 16px; color: #1d1d1f; background: #fff; line-height: 1.5; }
  header nav a { margin-right: 12px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
             clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
</style>

</head>
<body>
<a class="sr-only" href="#main">Skip to main content</a><a href="#" style="position:absolute;left:-9999px">Skip to navigation</a><main id="main"><h1>Docs</h1><p>Read the <a href="#">setup guide<span class="sr-only">(opens in a new window)</span></a>.</p><button><span aria-hidden="true">×</span><span class="sr-only">Close dialog</span></button></main>
</body>
</html>
