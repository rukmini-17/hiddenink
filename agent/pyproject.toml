[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vb-agent"
version = "0.1.0"
description = "Minimal Gemini coding agent for the HiddenInk demo (the agent being attacked)."
requires-python = ">=3.10"
dependencies = [
  "google-genai>=3.3.0",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["vb_agent"]
