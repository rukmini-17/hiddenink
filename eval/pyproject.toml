[project]
name = "hiddenink-eval"
version = "0.1.0"
description = "Runs the HiddenInk engine over the labeled corpus and reports detection, false-positive and speed metrics."
requires-python = ">=3.11"
dependencies = ["playwright>=1.49"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
